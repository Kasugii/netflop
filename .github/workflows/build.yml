name: Construire Netflop (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Netflop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Netflop
          path: Netflop.apk

      - name: Publier (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Netflop ${{ github.run_number }}
          files: Netflop.apk
          make_latest: true
